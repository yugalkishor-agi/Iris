<!DOCTYPE html>
<html>
<head>
    <title>Force Logout & Clear Cache</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyD9PHBh208uc4lDO9F3lvBUFUotnzGd56k",
            authDomain: "appmode-a6696.firebaseapp.com",
            projectId: "appmode-a6696",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.forceLogout = async function() {
            try {
                // Sign out from Firebase
                await signOut(auth);
                console.log('✅ Firebase signed out');

                // Clear all storage
                localStorage.clear();
                sessionStorage.clear();
                console.log('✅ Storage cleared');

                // Clear IndexedDB
                const dbs = await indexedDB.databases();
                dbs.forEach(db => indexedDB.deleteDatabase(db.name));
                console.log('✅ IndexedDB cleared');

                // Clear service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                    console.log('✅ Service workers cleared');
                }

                document.getElementById('status').innerHTML = `
                    <h2 style="color: green;">✅ Complete!</h2>
                    <p>All cache cleared. Now:</p>
                    <ol>
                        <li>Close this tab</li>
                        <li>Close ALL browser tabs</li>
                        <li>Close browser completely</li>
                        <li>Open browser → Go to localhost:5173</li>
                        <li>Login fresh</li>
                        <li>Test post opening</li>
                    </ol>
                `;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        };
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #b91c1c;
        }
        #status {
            margin-top: 20px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        ol {
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>🔥 Force Logout & Clear All Cache</h1>
    <p>This will completely clear all Firebase auth tokens and browser cache.</p>
    <button onclick="forceLogout()">CLEAR EVERYTHING NOW</button>
    <div id="status"></div>
</body>
</html>
