<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migrate Usernames - Add usernameLowercase</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
    button:hover { background: #2563eb; }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 14px;
    }
    .success { background: #d1fae5; color: #065f46; }
    .error { background: #fee2e2; color: #991b1b; }
    .info { background: #dbeafe; color: #1e40af; }
    .log {
      margin-top: 10px;
      max-height: 300px;
      overflow-y: auto;
      background: #f9fafb;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Migrate Usernames</h1>
    <p>This script will add the <code>usernameLowercase</code> field to all existing users who don't have it.</p>
    
    <div class="status info">
      <strong>⚠️ Important:</strong> This will update your database. Make sure you're ready.
    </div>

    <button id="migrateBtn" onclick="migrateUsers()">Start Migration</button>

    <div id="statusDiv"></div>
    <div id="logDiv" class="log" style="display: none;"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyD9PHBh208uc4lDO9F3lvBUFUotnzGd56k",
      authDomain: "appmode-a6696.firebaseapp.com",
      databaseURL: "https://appmode-a6696-default-rtdb.firebaseio.com",
      projectId: "appmode-a6696",
      storageBucket: "appmode-a6696.firebasestorage.app",
      messagingSenderId: "350506689842",
      appId: "1:350506689842:web:28faec26001e4f1331632b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.migrateUsers = async function() {
      const btn = document.getElementById('migrateBtn');
      const statusDiv = document.getElementById('statusDiv');
      const logDiv = document.getElementById('logDiv');
      
      btn.disabled = true;
      logDiv.style.display = 'block';
      logDiv.innerHTML = '';
      statusDiv.innerHTML = '<div class="status info">🔄 Migration in progress...</div>';

      function log(message) {
        logDiv.innerHTML += message + '<br>';
        logDiv.scrollTop = logDiv.scrollHeight;
      }

      try {
        log('📋 Fetching all users...');
        const usersSnapshot = await getDocs(collection(db, 'users'));
        const totalUsers = usersSnapshot.size;
        log(`✅ Found ${totalUsers} users`);

        let updated = 0;
        let skipped = 0;

        for (const userDoc of usersSnapshot.docs) {
          const userData = userDoc.data();
          const userId = userDoc.id;

          // Check if usernameLowercase already exists
          if (userData.usernameLowercase) {
            skipped++;
            log(`⏭️ Skipped ${userData.username} (already has usernameLowercase)`);
            continue;
          }

          // Add usernameLowercase field
          if (userData.username) {
            await updateDoc(doc(db, 'users', userId), {
              usernameLowercase: userData.username.toLowerCase()
            });
            updated++;
            log(`✅ Updated ${userData.username} → ${userData.username.toLowerCase()}`);
          }
        }

        statusDiv.innerHTML = `
          <div class="status success">
            <strong>✅ Migration Complete!</strong><br>
            Updated: ${updated} users<br>
            Skipped: ${skipped} users<br>
            Total: ${totalUsers} users
          </div>
        `;
        log(`🎉 Migration completed successfully!`);
        btn.textContent = 'Migration Complete ✅';
      } catch (error) {
        console.error('Migration error:', error);
        statusDiv.innerHTML = `
          <div class="status error">
            <strong>❌ Migration Failed</strong><br>
            ${error.message}
          </div>
        `;
        log(`❌ Error: ${error.message}`);
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
