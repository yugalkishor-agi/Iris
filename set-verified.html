<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set User as Verified - Iris Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: #64748b;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1e293b;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
      display: block;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      display: block;
    }

    .status.info {
      background: #dbeafe;
      color: #1e40af;
      border: 1px solid #93c5fd;
      display: block;
    }

    .users-list {
      margin-top: 30px;
      max-height: 300px;
      overflow-y: auto;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
    }

    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.2s;
    }

    .user-item:hover {
      background: #f1f5f9;
      transform: translateX(4px);
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-weight: 600;
      color: #1e293b;
      font-size: 14px;
    }

    .user-username {
      color: #64748b;
      font-size: 13px;
    }

    .verified-badge {
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎖️ Verification Admin Panel</h1>
    <p>Set users as verified to test the verification badge feature</p>

    <div class="form-group">
      <label for="userId">User ID or Username</label>
      <input 
        type="text" 
        id="userId" 
        placeholder="Enter user ID or @username"
      >
    </div>

    <button id="verifyBtn" onclick="setVerified()">
      ✨ Mark as Verified
    </button>

    <button id="loadUsersBtn" onclick="loadAllUsers()" style="margin-top: 12px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
      📋 Load All Users
    </button>

    <div id="status" class="status"></div>

    <div id="usersList" class="users-list" style="display: none;"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, updateDoc, collection, getDocs, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyD9PHBh208uc4lDO9F3lvBUFUotnzGd56k",
      authDomain: "appmode-a6696.firebaseapp.com",
      databaseURL: "https://appmode-a6696-default-rtdb.firebaseio.com",
      projectId: "appmode-a6696",
      storageBucket: "appmode-a6696.firebasestorage.app",
      messagingSenderId: "350506689842",
      appId: "1:350506689842:web:28faec26001e4f1331632b",
      measurementId: "G-SL94R1QEMC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.setVerified = async function() {
      const input = document.getElementById('userId').value.trim();
      const status = document.getElementById('status');
      const btn = document.getElementById('verifyBtn');

      if (!input) {
        status.className = 'status error';
        status.textContent = '❌ Please enter a user ID or username';
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = '⏳ Processing...';
        status.className = 'status info';
        status.textContent = '🔍 Searching for user...';

        let userId = input;

        // If starts with @, remove it
        if (input.startsWith('@')) {
          userId = input.substring(1);
        }

        // Try to get user by username first
        const usersRef = collection(db, 'users');
        const snapshot = await getDocs(usersRef);
        
        let userDoc = null;
        let actualUserId = null;

        snapshot.forEach(doc => {
          const data = doc.data();
          if (data.username === userId || doc.id === userId) {
            userDoc = doc;
            actualUserId = doc.id;
          }
        });

        if (!userDoc) {
          status.className = 'status error';
          status.textContent = `❌ User not found: ${input}`;
          btn.disabled = false;
          btn.textContent = '✨ Mark as Verified';
          return;
        }

        // Update user as verified
        const userRef = doc(db, 'users', actualUserId);
        await updateDoc(userRef, {
          verified: true
        });

        const userData = userDoc.data();
        status.className = 'status success';
        status.innerHTML = `
          ✅ Successfully verified!<br>
          <strong>${userData.displayName || userData.username}</strong> (@${userData.username})<br>
          <small>Refresh your app to see the verification badge</small>
        `;

        document.getElementById('userId').value = '';

      } catch (error) {
        console.error('Error:', error);
        status.className = 'status error';
        status.textContent = `❌ Error: ${error.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = '✨ Mark as Verified';
      }
    };

    window.loadAllUsers = async function() {
      const status = document.getElementById('status');
      const btn = document.getElementById('loadUsersBtn');
      const usersList = document.getElementById('usersList');

      try {
        btn.disabled = true;
        btn.textContent = '⏳ Loading...';
        status.className = 'status info';
        status.textContent = '📥 Fetching users from database...';

        const usersRef = collection(db, 'users');
        const snapshot = await getDocs(usersRef);

        if (snapshot.empty) {
          status.className = 'status error';
          status.textContent = '❌ No users found in database';
          btn.disabled = false;
          btn.textContent = '📋 Load All Users';
          return;
        }

        let html = '<h3 style="margin-bottom: 12px; color: #1e293b;">All Users (Click to Verify)</h3>';
        
        snapshot.forEach(doc => {
          const user = doc.data();
          const isVerified = user.verified === true;
          
          html += `
            <div class="user-item" onclick="document.getElementById('userId').value = '${user.username}'">
              <div class="user-info">
                <div class="user-name">${user.displayName || user.username}</div>
                <div class="user-username">@${user.username}</div>
              </div>
              ${isVerified ? '<span class="verified-badge">✓ VERIFIED</span>' : ''}
            </div>
          `;
        });

        usersList.innerHTML = html;
        usersList.style.display = 'block';

        status.className = 'status success';
        status.textContent = `✅ Loaded ${snapshot.size} users. Click a user to select them.`;

      } catch (error) {
        console.error('Error:', error);
        status.className = 'status error';
        status.textContent = `❌ Error: ${error.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = '📋 Load All Users';
      }
    };

    // Allow Enter key to submit
    document.getElementById('userId').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        setVerified();
      }
    });
  </script>
</body>
</html>
